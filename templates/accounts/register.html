{% extends 'base.html' %}

{% block title %}
    Register - EduConnect
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card">
            <div class="card-body">

                <h1 class="mb-4">
                    Create an EduConnect Account
                </h1>

                <form
                    method="post"
                    enctype="multipart/form-data"
                >
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Register
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}

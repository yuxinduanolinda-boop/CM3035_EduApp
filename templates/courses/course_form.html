{% extends 'base.html' %}

{% block title %}
    Create Course - EduApp
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="card">
            <div class="card-body">

                <h1 class="mb-4">
                    Create Course
                </h1>

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create Course
                    </button>

                    <a
                        href="{% url 'course_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
